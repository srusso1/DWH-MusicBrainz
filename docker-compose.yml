services:
  postgres:
    image: postgres:16
    container_name: dw_musicbrainz_pg
    restart: unless-stopped
    shm_size: 1gb
    environment:
      POSTGRES_USER: ${PG_USER:-postgres}
      POSTGRES_PASSWORD: ${PG_PASSWORD:-postgres123}
      POSTGRES_DB: ${PG_DATABASE:-dw_musicbrainz}
    ports:
      - "${PG_PORT:-5435}:5432"
    volumes:
      - mb_pgdata:/var/lib/postgresql/data
    command: >
      postgres -c max_wal_size=8GB
               -c checkpoint_completion_target=0.9
               -c maintenance_work_mem=1GB
               -c shared_buffers=1GB
               -c work_mem=64MB

volumes:
  mb_pgdata:
